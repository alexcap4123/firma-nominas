<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firma Nóminas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1F3864, #2E75B6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            width: 360px;
        }
        .logo { font-size: 48px; margin-bottom: 10px; }
        h1 { color: #1F3864; margin-bottom: 5px; font-size: 22px; }
        p { color: #888; font-size: 13px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #2E75B6; }
        button {
            width: 100%;
            padding: 13px;
            background: #2E75B6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover { background: #1F3864; }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📄</div>
        <h1>Firma Nóminas</h1>
        <p>Accede con tus credenciales de empresa</p>
        <input type="text" id="usuario" placeholder="Usuario (ej: juan.garcia)" />
        <input type="password" id="password" placeholder="Contraseña" />
        <button onclick="login()">Entrar</button>
        <p class="error" id="error">Usuario o contraseña incorrectos</p>
    </div>

    <script>
        const trabajadores = [
            { usuario: "juan.garcia", password: "1234", nombre: "Juan García" },
            { usuario: "maria.lopez", password: "1234", nombre: "María López" },
            { usuario: "admin", password: "admin123", nombre: "Administrador" }
        ];

        function login() {
            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;
            const trabajador = trabajadores.find(t => t.usuario === usuario && t.password === password);
            if (trabajador) {
                alert("¡Bienvenido, " + trabajador.nombre + "!");
            } else {
                document.getElementById("error").style.display = "block";
            }
        }
    </script>
</body>
</html>
